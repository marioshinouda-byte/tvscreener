name: Probe Forex H1 alternative source

on:
  push:
    paths:
      - "scripts/probe_dukascopy.py"
      - ".github/workflows/dukascopy-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe_dukascopy.py

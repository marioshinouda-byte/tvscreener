name: Run Forex Scanner

on:
  workflow_dispatch:
  schedule:
    # Run hourly away from the top-of-hour GitHub Actions load peak.
    # GitHub schedule is best-effort; :17 materially reduces delay/drop risk vs :05.
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "forex_scanner.py"
      - ".github/workflows/forex-scanner.yml"

permissions:
  contents: write

concurrency:
  group: forex-scanner-main
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      # Repository variable: set to "false" to hide/disable the optional mode.
      ENABLE_HTF_REVERSAL: ${{ vars.ENABLE_HTF_REVERSAL || 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run advanced Forex scanner
        run: |
          python forex_scanner.py | tee scan_output.txt

      - name: Publish latest results to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST_FOREX_SCAN.md WEEKLY_FOREX_TOP5.json
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Update latest Forex scan"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Save scanner output artifact
        uses: actions/upload-artifact@v4
        with:
          name: forex-scan-output
          retention-days: 7
          path: |
            scan_output.txt
            LATEST_FOREX_SCAN.md
            WEEKLY_FOREX_TOP5.json
